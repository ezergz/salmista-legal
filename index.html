<style>

  body {

  ul { list-style: none; padding: 0; margin: 0 0 2rem; }
  li { margin: 0 0 .75rem; }
  li a {
    display: block;
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 10px;
    padding: 1rem 1.15rem;
    color: var(--accent);
    text-decoration: none;
    font-weight: 600;
  }
  li a span { display: block; color: var(--muted); font-weight: 400; font-size: .9rem; margin-top: .2rem; }
  footer { color: var(--muted); font-size: .875rem; border-top: 1px solid var(--rule); padding-top: 1.25rem; }
  a { color: var(--accent); }
  @media (max-width: 480px) {
